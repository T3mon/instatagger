<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>instatagger</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root { color-scheme: dark; --bg: #0d0d0f; --panel: #161619; --raise: #1f1f23; --line: #26262b; --text: #f4f4f5; --muted: #a1a1aa; --accent: #c13584; --no: #e5484d; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  a { color: var(--text); }
  button, select, input { font: inherit; color: var(--text); }
  button { cursor: pointer; }
  button:disabled { opacity: .35; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); }
  .top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 10px 16px; }
  .brand { font-weight: 600; font-size: 16px; text-decoration: none; }
  #title { font-size: 20px; font-weight: 700; padding-left: 16px; border-left: 1px solid var(--line); }
  .search { flex: 1 1 260px; display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; height: 40px; }
  .search input { flex: 1; background: transparent; border: 0; outline: none; }
  select { height: 40px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; }
  .btn { height: 40px; display: inline-flex; align-items: center; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); text-decoration: none; }
  .btn.main { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
  .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 16px; border-top: 1px solid var(--line); min-height: 48px; }
  #count { color: var(--muted); margin-right: 4px; }
  .chip { height: 32px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  .chip.no { background: transparent; border-color: var(--no); color: #ff9592; }
  .linkbtn { border: 0; background: none; color: var(--muted); text-decoration: underline; }
  .layout { display: flex; flex-wrap: wrap; align-items: flex-start; }
  nav { flex: 1 1 250px; max-width: 290px; padding: 12px 10px 24px; border-right: 1px solid var(--line); position: sticky; top: 106px; max-height: calc(100vh - 106px); overflow-y: auto; }
  nav details { margin-bottom: 6px; }
  .spice { padding: 0 8px 12px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
  .spice h2 { margin: 8px 0 4px; font-size: 15px; font-weight: 600; }
  .spice .range { margin: 0 0 6px; font-weight: 600; }
  .dual { position: relative; height: 32px; margin: 0 10px 8px; }
  .dual .track, .dual .fill { position: absolute; top: 14px; height: 4px; border-radius: 2px; }
  .dual .track { left: 0; right: 0; background: #3f3f46; }
  .dual .fill { background: var(--accent); }
  .dual input { position: absolute; inset: 0; width: 100%; margin: 0; background: none; pointer-events: none; -webkit-appearance: none; appearance: none; }
  .dual input::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); border: 5px solid var(--accent); cursor: pointer; }
  .dual input::-moz-range-thumb { pointer-events: auto; width: 14px; height: 14px; border-radius: 50%; background: var(--bg); border: 5px solid var(--accent); cursor: pointer; }
  .dual input::-webkit-slider-runnable-track { background: none; }
  #presets button { display: flex; width: 100%; justify-content: space-between; min-height: 32px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; text-align: left; }
  #presets button:hover { background: var(--raise); }
  #presets button[aria-pressed="true"] { background: #2a1420; color: #f9a8d4; font-weight: 600; }
  #presets span { color: var(--muted); font-size: 12px; }
  nav summary { cursor: pointer; padding: 8px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .tag { display: flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 4px 0 8px; border-radius: 8px; }
  .tag.yes { background: #2a1420; } .tag.yes .name { color: #f9a8d4; }
  .tag.no .name { color: #ff9592; text-decoration: line-through; }
  .tag .name { flex: 1; } .tag .n { color: var(--muted); font-size: 12px; margin-right: 4px; }
  .tag button { width: 28px; height: 28px; border-radius: 6px; border: 1px solid #3f3f46; background: transparent; }
  .tag button[aria-pressed="true"].plus { background: var(--accent); border-color: var(--accent); }
  .tag button[aria-pressed="true"].minus { background: var(--no); border-color: var(--no); }
  main { flex: 999 1 480px; min-width: 0; padding: 12px 16px 24px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  #grid button { position: relative; padding: 0; border: 0; border-radius: 8px; overflow: hidden; aspect-ratio: 4 / 5; background: var(--panel); }
  #grid button[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
  #grid img { display: block; width: 100%; height: 100%; object-fit: cover; }
  #grid span { position: absolute; inset: auto 0 0; padding: 16px 6px 4px; font-size: 12px; text-align: left; background: linear-gradient(transparent, #000c); }
  aside { flex: 1 1 280px; max-width: 340px; padding: 12px 16px 24px; border-left: 1px solid var(--line); position: sticky; top: 106px; max-height: calc(100vh - 106px); overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  aside > * { flex-shrink: 0; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(1180px, calc(100% - 32px)); max-height: 86vh; }
  dialog::backdrop { background: #000b; }
  .dhead { position: sticky; top: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .dhead h2 { margin: 0; font-size: 20px; flex: 1; }
  .mode { display: flex; background: var(--bg); border-radius: 8px; padding: 3px; }
  .mode button { height: 34px; padding: 0 14px; border: 0; border-radius: 6px; background: transparent; }
  .mode button[aria-pressed="true"] { background: var(--raise); font-weight: 600; }
  #alltags { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; padding: 16px 20px 20px; }
  #alltags button, .bt { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 32px; padding: 4px 10px; border-radius: 6px; border: 0; background: var(--raise); text-align: left; }
  #alltags button:hover, .bt:hover { background: #2a2a30; }
  #alltags button.on { background: var(--accent); color: #fff; }
  #alltags span, .bt b { color: var(--muted); font-size: 12px; font-weight: 500; }
  #alltags button.on span { color: #fff; }
  aside img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 10px; background: var(--panel); }
  .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .meta span { color: var(--muted); font-size: 12px; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { padding: 4px 10px; border-radius: 999px; background: var(--raise); }
  .tagpill { padding: 4px 10px; border-radius: 999px; border: 1px solid #3f3f46; background: transparent; font-size: 13px; }
  .booru summary { cursor: pointer; color: var(--muted); margin-bottom: 8px; }
  .bt { display: inline-flex; min-height: 28px; font-size: 12px; }
  .actions { display: flex; gap: 8px; } .actions .open { flex: 1; }
  .open { height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: var(--text); color: var(--bg); text-decoration: none; font-weight: 500; }
  .delphoto { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); }
  .delphoto:hover { color: #ff9592; border-color: #5b1d1d; }
  .delphoto[data-armed] { background: var(--no); border-color: var(--no); color: #fff; }
  .spin { display: inline-block; width: 16px; height: 16px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: middle; }
  .loading { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 80px 0; color: var(--muted); }
  .loading .spin { width: 36px; height: 36px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
  @media (max-width: 900px) { nav, aside { position: static; max-height: none; max-width: none; border: 0; } }
</style>
</head>
<body>
<header>
  <div class="top">
    <a class="brand" href="/" id="home">instatagger</a>
    <span id="title"></span>
    <label class="search"><span class="sr">Find a tag</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input id="find" placeholder="Find a tag, e.g. beach" autocomplete="off">
    </label>
    <label>Sort <select id="sort">
      <option value="likes">Most liked</option>
      <option value="least">Least liked</option>
      <option value="spicy">Most suggestive</option>
      <option value="new">Newest</option>
      <option value="old">Oldest</option>
    </select></label>
    <a class="btn" id="all" href="../index.html">All models</a>
    <a class="btn" id="models" href="/models">Models</a>
    <a class="btn main" id="add" href="/add" target="_blank">+ Add model</a>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="layout">
  <nav aria-label="Filters" id="filters">
    <section class="spice" aria-labelledby="spicehead">
      <h2 id="spicehead">Suggestiveness</h2>
      <p class="range" id="spiceval">0% – 100%</p>
      <div class="dual">
        <span class="track"></span><span class="fill" id="spicefill"></span>
        <input type="range" id="lo" min="0" max="100" step="1" value="0" aria-label="Suggestiveness from">
        <input type="range" id="hi" min="0" max="100" step="1" value="100" aria-label="Suggestiveness to">
      </div>
      <div id="presets"></div>
    </section>
    <div id="taglist"></div>
  </nav>
  <main>
    <div id="grid"><div class="loading"><span class="spin"></span>Loading photos...</div></div>
  </main>
  <aside aria-label="Selected photo" id="inspector"></aside>
</div>
<dialog id="tagbox" aria-labelledby="tagboxhead">
  <div class="dhead">
    <h2 id="tagboxhead">All tags</h2>
    <label class="search" style="flex: 0 1 280px"><span class="sr">Search tags</span><input id="tagfind" placeholder="Search tags" autocomplete="off"></label>
    <div class="mode" role="group" aria-label="Order">
      <button id="bycount" aria-pressed="true">Popular</button><button id="byname" aria-pressed="false">A–Z</button>
    </div>
    <button class="btn" id="tagclose">Close</button>
  </div>
  <div id="alltags"></div>
</dialog>
<script>
const D = /*DATA*/null;  // filled in by instatagger.py
const sel = new Map();  // tag -> true: must have it, false: must not have it
let picked = null, shown = [];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
const src = it => `${it.h ? it.h + "/" : ""}thumbs/${it.f}`;
const likes = it => it.l > 3 ? it.l : null;  // Instagram reports 3 when the model hides likes on a post
const shownLikes = it => likes(it) === null ? "likes hidden" : likes(it).toLocaleString();
const order = {  // posts with hidden likes go last either way
  likes: (a, b) => (likes(b) ?? -1) - (likes(a) ?? -1),
  least: (a, b) => (likes(a) ?? 1e12) - (likes(b) ?? 1e12),
  spicy: (a, b) => (b.x ?? 0) - (a.x ?? 0) || (likes(b) ?? -1) - (likes(a) ?? -1),
  new: (a, b) => b.d.localeCompare(a.d) || a.n - b.n,
  old: (a, b) => a.d.localeCompare(b.d) || a.n - b.n,
};
const TRASH = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">` +
  `<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>`;
const RATING = {safe: "#14532d", suggestive: "#3b2a12", questionable: "#4c1d1d", explicit: "#5b1230"};

// The filter list is built once; render() only updates counts and states, so open groups stay open
$("taglist").innerHTML = D.groups.filter(([g]) => g !== "Rating").map(([g, tags], k) => `<details ${k < 3 ? "open" : ""}><summary>${esc(g)}</summary>${tags.map(t =>
  `<div class="tag" data-t="${esc(t)}"><span class="name">${esc(t)}</span><span class="n"></span>` +
  `<button class="plus" aria-label="Must have ${esc(t)}" aria-pressed="false">+</button>` +
  `<button class="minus" aria-label="Exclude ${esc(t)}" aria-pressed="false">−</button></div>`).join("")}</details>`).join("");
const rows = [...document.querySelectorAll(".tag")];
// Filters are tags.txt names, or "b:<booru tag>" for any raw tag the model saw (picked from All tags or a photo's details)
for (const it of D.items) it.bs = new Set((it.b || []).map(([j]) => D.vocab[j]));
const has = (it, key) => key.startsWith("b:") ? it.bs.has(key.slice(2)) : it.t.includes(key);
const label = key => key.startsWith("b:") ? key.slice(2).replace(/_/g, " ") : key;

const spice = it => (it.x ?? 0) / 3 * 100;  // x: the tagger's rating averaged by confidence, 0 safe ... 3 explicit
const BANDS = [["Safe", 0, 16], ["Suggestive", 17, 49], ["Questionable", 50, 83], ["Explicit", 84, 100]];  // split halfway between levels

function render() {
  const lo = +$("lo").value, hi = +$("hi").value, spiced = lo > 0 || hi < 100;
  $("spiceval").textContent = `${lo}% – ${hi}%`;
  $("spicefill").style.left = lo + "%";
  $("spicefill").style.right = 100 - hi + "%";
  const tagged = D.items.filter(it => [...sel].every(([t, want]) => has(it, t) === want));
  $("presets").innerHTML = BANDS.map(([name, a, b]) => `<button data-lo="${a}" data-hi="${b}" aria-pressed="${lo === a && hi === b}">` +
    `${name} (${a}–${b}%)<span>${tagged.filter(it => Math.round(spice(it)) >= a && Math.round(spice(it)) <= b).length.toLocaleString()}</span></button>`).join("");
  shown = tagged.filter(it => Math.round(spice(it)) >= lo && Math.round(spice(it)) <= hi).sort(order[$("sort").value]);
  const n = {};
  for (const it of shown) for (const t of it.t) n[t] = (n[t] || 0) + 1;
  for (const row of rows) {
    const t = row.dataset.t, state = sel.get(t);
    row.className = "tag" + (state === true ? " yes" : state === false ? " no" : "");
    row.querySelector(".n").textContent = (n[t] || 0).toLocaleString();
    row.querySelector(".plus").setAttribute("aria-pressed", state === true);
    row.querySelector(".minus").setAttribute("aria-pressed", state === false);
    row.querySelector(".plus").disabled = !n[t] && state !== true;
  }
  $("chips").innerHTML = `<span id="count">${shown.length.toLocaleString()} of ${D.items.length.toLocaleString()} photos</span>` +
    (spiced ? `<button class="chip" id="unspice" aria-label="Remove suggestiveness filter">suggestive ${lo}–${hi}% ✕</button>` : "") +
    [...sel].map(([t, want]) => `<button class="chip${want ? "" : " no"}" data-t="${esc(t)}" aria-label="Remove filter ${esc(label(t))}">${want ? "" : "not "}${esc(label(t))} ✕</button>`).join("") +
    `<button class="btn" id="anytag" style="height: 32px">+ Any tag</button>` +
    (sel.size || spiced ? `<button class="linkbtn" id="clear">Clear all</button>` : `<span style="color:var(--muted)">Use + to require a tag, − to exclude it</span>`);
  if ($("tagbox").open) tagList();
  if (!shown.includes(picked)) picked = shown[0] || null;
  $("grid").innerHTML = shown.map((it, i) => `<button data-i="${i}" aria-pressed="${it === picked}" aria-label="${esc(it.t.join(", ") || "no tags")}">` +
    `<img src="${src(it)}" alt="" loading="lazy"><span>♥ ${shownLikes(it)} · ${it.d}${it.h ? " · @" + it.h : ""}</span></button>`).join("");
  inspect();
}

function inspect() {
  const it = picked;
  if (!it) return $("inspector").innerHTML = `<p style="color:var(--muted)">No photos match these filters.</p>`;
  const rating = it.t.find(t => RATING[t]);
  $("inspector").innerHTML = `<img src="${src(it)}" alt="Selected photo">` +
    `<div class="meta"><strong>@${esc(it.h || D.handle)}</strong><span>${it.d} · slide ${it.n}</span></div>` +
    `<div class="pills"><span class="pill">♥ ${shownLikes(it)}</span>${rating ? `<span class="pill" style="background:${RATING[rating]}">${rating}</span>` : ""}</div>` +
    `<div class="pills">${it.t.filter(t => !RATING[t] && !t.startsWith("@")).map(t => `<button class="tagpill" data-t="${esc(t)}" title="Show only photos with ${esc(t)}">${esc(t)}</button>`).join("")}</div>` +
    `<div class="actions"><a class="open" href="https://www.instagram.com/p/${it.c}/?img_index=${it.n}" target="_blank" rel="noopener">Open on Instagram</a>` +
    (location.protocol === "file:" ? "" : `<button class="delphoto" id="delphoto" aria-label="Delete this photo" title="Delete this photo">${TRASH}</button>`) + `</div>` +
    (it.b ? `<details class="booru"><summary>All ${it.b.length} tags the model saw</summary><div class="pills">` +
      it.b.map(([j, pct]) => `<button class="bt" data-t="b:${esc(D.vocab[j])}" title="Show only photos with this tag">${esc(D.vocab[j].replace(/_/g, " "))} <b>${pct}%</b></button>`).join("") +
      `</div></details>` : "");
}

let byName = false;
function tagList() {  // every raw tag among the photos shown now, with how many have it
  const n = new Map();
  for (const it of shown) for (const t of it.bs) n.set(t, (n.get(t) || 0) + 1);
  for (const [k, want] of sel) if (want && k.startsWith("b:") && !n.has(k.slice(2))) n.set(k.slice(2), 0);
  const q = $("tagfind").value.trim().toLowerCase().replace(/ /g, "_");
  const list = [...n].filter(([t]) => !q || t.includes(q))
    .sort(byName ? ([a], [b]) => a.localeCompare(b) : ([a, x], [b, y]) => y - x || a.localeCompare(b));
  $("tagboxhead").textContent = `All tags (${list.length.toLocaleString()})`;
  $("alltags").innerHTML = list.map(([t, c]) => `<button data-t="b:${esc(t)}" class="${sel.get("b:" + t) ? "on" : ""}" aria-pressed="${!!sel.get("b:" + t)}">` +
    `${esc(t.replace(/_/g, " "))}<span>${c.toLocaleString()}</span></button>`).join("");
}

$("filters").onclick = e => {
  const b = e.target.closest("button"), row = b && b.closest(".tag");
  if (!row) return;
  const t = row.dataset.t, want = b.classList.contains("plus");
  sel.get(t) === want ? sel.delete(t) : sel.set(t, want);  // pressing the active button again turns it off
  render();
};
$("chips").onclick = e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.id === "anytag") { $("tagbox").showModal(); tagList(); return; }
  if (b.id === "clear" || b.id === "unspice") { $("lo").value = 0; $("hi").value = 100; }
  if (b.id === "clear") sel.clear(); else if (b.dataset.t) sel.delete(b.dataset.t);
  render();
};
$("grid").onclick = e => {
  const b = e.target.closest("button");
  if (!b) return;
  picked = shown[+b.dataset.i];
  $("grid").querySelector('[aria-pressed="true"]')?.setAttribute("aria-pressed", "false");
  b.setAttribute("aria-pressed", "true");
  inspect();
};
async function deletePhoto(b) {  // two clicks: the first one only arms it
  if (!b.dataset.armed) { b.dataset.armed = 1; b.title = b.ariaLabel = "Click again to delete it for good"; return; }
  const it = picked, i = shown.indexOf(it);
  b.disabled = true;
  b.innerHTML = `<span class="spin"></span>`;
  try {
    const r = await fetch("/api/delete", {method: "POST", headers: {"X-Instatagger": "1", "Content-Type": "application/json"},
      body: JSON.stringify({u: it.h || D.handle, files: [it.f]})});
    if (!r.ok) throw new Error((await r.json()).error);
  } catch (err) { b.disabled = false; delete b.dataset.armed; b.innerHTML = TRASH; alert(`Couldn't delete: ${err.message}`); return; }
  D.items.splice(D.items.indexOf(it), 1);
  picked = shown[i + 1] || shown[i - 1] || null;  // the next photo takes its place, so cleaning up is click, click, next
  render();
}
$("inspector").onclick = e => {
  if (e.target.closest("#delphoto")) return deletePhoto(e.target.closest("#delphoto"));
  const b = e.target.closest(".tagpill, .bt");
  if (b) { sel.set(b.dataset.t, true); render(); }
};
$("alltags").onclick = e => {  // the list stays open, so several tags can be picked in a row
  const b = e.target.closest("button");
  if (!b) return;
  sel.get(b.dataset.t) ? sel.delete(b.dataset.t) : sel.set(b.dataset.t, true);
  render();
};
$("tagfind").oninput = tagList;
$("bycount").onclick = $("byname").onclick = e => {
  byName = e.target.id === "byname";
  $("bycount").setAttribute("aria-pressed", !byName);
  $("byname").setAttribute("aria-pressed", byName);
  tagList();
};
$("tagclose").onclick = () => $("tagbox").close();
$("find").oninput = () => {
  const q = $("find").value.trim().toLowerCase();
  for (const row of rows) row.hidden = q && !row.dataset.t.toLowerCase().includes(q);
  for (const d of $("filters").querySelectorAll("details")) if (q) d.open = [...d.querySelectorAll(".tag")].some(r => !r.hidden);
};
$("sort").onchange = render;
$("lo").oninput = () => { if (+$("lo").value > +$("hi").value) $("hi").value = $("lo").value; render(); };  // handles can't cross
$("hi").oninput = () => { if (+$("hi").value < +$("lo").value) $("lo").value = $("hi").value; render(); };
$("presets").onclick = e => {
  const b = e.target.closest("button");
  if (!b) return;
  const on = b.getAttribute("aria-pressed") === "true";  // clicking the active pick again resets it
  $("lo").value = on ? 0 : b.dataset.lo;
  $("hi").value = on ? 100 : b.dataset.hi;
  render();
};
$("title").textContent = D.title || "@" + D.handle;
document.title = (D.title || "@" + D.handle) + " · instatagger";
$("all").hidden = !!D.all;  // the all-models page doesn't link to itself
$("home").href = D.all ? "index.html" : "../index.html";
$("add").hidden = $("models").hidden = location.protocol === "file:";  // both need serve.py
render();
</script>
</body>
</html>
