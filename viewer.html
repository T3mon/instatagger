<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>instatagger</title>
<style>
  :root { color-scheme: dark; --bg: #0b0b0c; --panel: #1c1c1f; --line: #2e2e33; --text: #f4f4f5; --muted: #a1a1aa; --accent: #c13584; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 1; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 8px; }
  h1 { margin: 0; font-size: 18px; }
  #count, .group b { color: var(--muted); }
  .group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0; }
  .group b { width: 84px; font-weight: 500; }
  button, select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
  button:disabled { opacity: .35; cursor: default; }
  button span { color: var(--muted); margin-left: 4px; }
  button[aria-pressed="true"] span { color: inherit; }
  button[aria-pressed="mixed"] { border-color: #e5484d; color: #ff9592; text-decoration: line-through; }
  .hint { color: var(--muted); font-size: 12px; }
  a { color: var(--text); }
  details { margin: 4px 0 8px; }
  summary { cursor: pointer; color: var(--muted); }
  .stats { overflow-x: auto; }
  .stats table { border-collapse: collapse; font-size: 12px; margin-top: 6px; }
  .stats th, .stats td { padding: 3px 10px 3px 0; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); }
  .stats th { color: var(--muted); font-weight: 500; }
  .stats tr:last-child td { border-bottom: 0; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 20px; width: min(480px, calc(100% - 32px)); }
  dialog::backdrop { background: #000a; }
  dialog h2 { margin: 0 0 12px; font-size: 18px; }
  dialog input:not([type=checkbox]) { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  #who { width: 100%; margin: 6px 0 10px; }
  #limit { width: 80px; margin: 0 4px; }
  #info table { border-collapse: collapse; margin: 12px 0; }
  #info td { padding: 3px 14px 3px 0; vertical-align: top; }
  #info td:first-child, #eta, #progress { color: var(--muted); }
  #info td:last-child { white-space: pre-line; }
  #pbar { width: 100%; accent-color: var(--accent); }
  .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 4px; padding: 4px 16px 16px; }
  main a { position: relative; display: block; aspect-ratio: 4 / 5; background: var(--panel); }
  main img { display: block; width: 100%; height: 100%; object-fit: cover; }
  main a span { position: absolute; inset: auto 0 0; padding: 16px 6px 4px; font-size: 12px; background: linear-gradient(transparent, #000c); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1 id="title"></h1>
    <span id="count"></span>
    <label>Sort <select id="sort">
      <option value="likes">Most liked</option>
      <option value="least">Least liked</option>
      <option value="spicy">Most suggestive</option>
      <option value="new">Newest</option>
      <option value="old">Oldest</option>
    </select></label>
    <button id="clear">Clear tags</button>
    <a id="all" href="../index.html">All models</a>
    <button id="add">+ Add model</button>
    <span class="hint">Click a tag: must have · again: exclude it · again: off</span>
  </div>
  <details id="statsbox"><summary>Stats</summary><div class="stats"><table id="stats"></table></div></details>
  <div id="groups"></div>
</header>
<main id="grid"></main>
<dialog id="addbox">
  <h2>Add model</h2>
  <form id="lookup">
    <label>Instagram link or handle<input id="who" required placeholder="https://www.instagram.com/..."></label>
    <div class="row"><button>Look up</button></div>
  </form>
  <div id="info"></div>
  <div id="go" hidden>
    <label><input type="checkbox" id="limited" checked> Only the newest<input type="number" id="limit" value="100" min="1" step="1">posts</label>
    <p id="eta"></p>
    <div class="row"><button id="start">Add her</button></div>
  </div>
  <p id="progress" role="status"></p>
  <progress id="pbar" hidden></progress>
  <div class="row"><button id="reload" hidden onclick="location.reload()">Reload page</button><button id="close">Close</button></div>
</dialog>
<script>
const D = /*DATA*/null;  // filled in by instatagger.py
const sel = new Map();  // tag -> true: must have it, false: must not have it
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
const order = {
  likes: (a, b) => b.l - a.l,
  least: (a, b) => a.l - b.l,
  spicy: (a, b) => (b.x ?? 0) - (a.x ?? 0) || b.l - a.l,
  new: (a, b) => b.d.localeCompare(a.d) || a.n - b.n,
  old: (a, b) => a.d.localeCompare(b.d) || a.n - b.n,
};

function render(focus) {
  const items = D.items.filter(it => [...sel].every(([t, want]) => it.t.includes(t) === want)).sort(order[$("sort").value]);
  const n = {};
  for (const it of items) for (const t of it.t) n[t] = (n[t] || 0) + 1;
  $("count").textContent = `${items.length} of ${D.items.length} photos`;
  $("groups").innerHTML = D.groups.map(([g, tags]) => `<div class="group"><b>${esc(g)}</b>${tags.map(t =>
    `<button data-t="${esc(t)}" aria-pressed="${sel.has(t) ? (sel.get(t) ? "true" : "mixed") : "false"}" ${n[t] || sel.has(t) ? "" : "disabled"}>${esc(t)}<span>${n[t] || 0}</span></button>`
  ).join("")}</div>`).join("");
  $("grid").innerHTML = items.map(it => {
    const tags = esc(it.t.join(", ") || "no tags");
    return `<a href="https://www.instagram.com/p/${it.c}/?img_index=${it.n}" target="_blank" rel="noopener" title="${tags}">` +
      `<img src="${it.h ? it.h + "/" : ""}thumbs/${it.f}" alt="${tags}" loading="lazy">` +
      `<span>♥ ${it.l.toLocaleString()} · ${it.d}${it.h ? " · @" + it.h : ""}</span></a>`;
  }).join("");
  if (focus) document.querySelector(`[data-t="${CSS.escape(focus)}"]`)?.focus();
}

$("groups").onclick = e => {
  const b = e.target.closest("button");
  if (!b) return;
  const t = b.dataset.t;  // cycles: off -> must have -> exclude -> off
  !sel.has(t) ? sel.set(t, true) : sel.get(t) ? sel.set(t, false) : sel.delete(t);
  render(b.dataset.t);
};
$("sort").onchange = () => render();
$("clear").onclick = () => { sel.clear(); render(); };
$("title").textContent = document.title = D.title || "@" + D.handle;
$("all").hidden = !!D.all;  // the all-models page doesn't link to itself
const cols = [["model", "Model"], ["posts", "Posts"], ["photos", "Photos"], ["skipped", "Skipped (no girl)"], ["from", "Oldest"],
  ["to", "Newest"], ["likes", "Median ♥"], ["top", "Top tags"], ["thumbs", "Previews on disk"], ["total", "All files on disk"]];
$("statsbox").hidden = !D.stats;
if (D.stats) $("stats").innerHTML = `<tr>${cols.map(([, h]) => `<th>${h}</th>`).join("")}</tr>` +
  D.stats.map(s => `<tr>${cols.map(([k]) => `<td>${esc(s[k])}</td>`).join("")}</tr>`).join("");
render();

let P = null, polling = false;  // the looked-up profile
const api = (path, opts = {}) => fetch(path, {...opts, headers: {"X-Instatagger": "1", "Content-Type": "application/json"}})
  .then(async r => { const j = await r.json(); if (!r.ok) throw new Error(j.error); return j; });
const fmt = s => s < 90 ? `${Math.round(s)} s` : `${Math.round(s / 60)} min`;

function eta() {  // measured on earlier runs: a page of 12 posts every ~10 s, ~3 photos a post, ~2 downloads/s,
  // and tagging re-scores her whole library (photos already added too), plus ~15 s to start up
  const posts = $("limited").checked ? Math.min(Math.max(Math.floor(+$("limit").value) || 0, 0), P.posts) : P.posts;
  const photos = posts * 3, list = Math.ceil(posts / 12) * 10.5, down = photos / 2, score = 30 + (photos + P.have) * 0.25;
  $("eta").textContent = `About ${fmt(15 + list + down + score)} for ${posts.toLocaleString()} posts (~${photos.toLocaleString()} photos): ` +
    `listing ${fmt(list)}, downloading ${fmt(down)}, tagging ${fmt(score)}. Downloads depend on your connection.`;
}

async function poll() {
  if (polling) return;
  polling = true;
  for (;;) {
    const s = await api("/api/status").catch(() => null);
    if (!s || !s.handle) break;
    const step = (s.log.filter(l => l.startsWith("Step ")).at(-1) || "Starting").replace(/^Step (\d)\/3: /, "Step $1 of 3: ");
    const last = [...s.log].reverse().find(l => /^Step |\d+\/\d+ (posts listed|photos downloaded)/.test(l)) || "";
    const count = !last.startsWith("Step ") && last.match(/(\d+)\/(\d+)/);
    const bar = $("pbar");
    bar.hidden = !s.running;
    if (count) { bar.max = +count[2]; bar.value = +count[1]; } else bar.removeAttribute("value");  // no count yet: moving bar
    if (s.running) {
      $("progress").textContent = `Adding @${s.handle} (${fmt(s.elapsed)} so far). ${step}` + (count ? ` (${(+count[1]).toLocaleString()} of ${(+count[2]).toLocaleString()})` : "");
    } else {
      const done = s.log.map(l => l.match(/^(\d+) photos ->/)).filter(Boolean).at(-1);
      const why = [...s.log].reverse().find(l => /Only|No photos|stopped|rror|Not an Instagram/.test(l)) || s.log.at(-1) || "unknown error";
      $("progress").textContent = s.code === 0 ? `Done: @${s.handle} now has ${done ? (+done[1]).toLocaleString() + " photos" : "her page"}, in ${fmt(s.elapsed)}.`
        : `Adding @${s.handle} stopped: ${why.trim()}`;
      $("reload").hidden = s.code !== 0;
      break;
    }
    await new Promise(r => setTimeout(r, 2000));
  }
  polling = false;
}

$("add").onclick = () => {
  if (location.protocol === "file:") return alert("Adding models needs the server: run  python serve.py  and open http://localhost:8765");
  $("addbox").showModal();
  poll();
};
$("close").onclick = () => $("addbox").close();
$("lookup").onsubmit = async e => {
  e.preventDefault();
  $("go").hidden = true;
  $("info").textContent = "Looking up...";
  try { P = await api("/api/profile?u=" + encodeURIComponent($("who").value.trim())); }
  catch (err) { $("info").textContent = err.message; return; }
  const row = (k, v) => `<tr><td>${k}</td><td>${v}</td></tr>`;
  $("info").innerHTML = "<table>" + row("Name", esc(P.name || "-") + (P.verified ? " (verified)" : "")) + row("Handle", "@" + esc(P.handle)) +
    row("Posts", P.posts.toLocaleString()) + row("Followers", P.followers.toLocaleString()) + row("Following", P.following.toLocaleString()) +
    row("Bio", esc(P.bio || "-")) + (P.have ? row("Already added", `${P.have.toLocaleString()} photos. Running again only downloads new posts.`) : "") +
    "</table>" + (P.private ? "<p>Private account you don't follow, so it can't be added.</p>" : "");
  $("go").hidden = P.private;
  if (!P.private) eta();
};
$("limited").onchange = $("limit").oninput = () => P && eta();
$("start").onclick = async () => {
  const n = Math.floor(+$("limit").value);
  if ($("limited").checked && !(n >= 1)) return $("progress").textContent = "Enter how many posts: 1 or more.";
  try {
    await api("/api/add", {method: "POST", body: JSON.stringify({u: P.handle, limit: $("limited").checked ? n : null})});
    $("go").hidden = true;
    poll();
  } catch (err) { $("progress").textContent = err.message; }
};
</script>
</body>
</html>
