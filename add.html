<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add model</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root { color-scheme: dark; --bg: #0b0b0c; --panel: #1c1c1f; --line: #2e2e33; --text: #f4f4f5; --muted: #a1a1aa; --accent: #c13584; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px; }
  h1 { margin: 0 0 16px; font-size: 20px; }
  a { color: var(--text); }
  button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  input:not([type=checkbox]) { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  #who { width: 100%; margin: 6px 0 10px; }
  #limit { width: 80px; margin: 0 4px; }
  #info table { border-collapse: collapse; margin: 12px 0; }
  #info td { padding: 3px 14px 3px 0; vertical-align: top; }
  #info td:first-child, #eta, .back, .muted { color: var(--muted); }
  #msg { color: #ff9592; }
  #run { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 8px; }
  #runsteps progress { display: block; width: calc(100% - 20px); margin: 6px 0 0 20px; accent-color: var(--accent); }
  #runsteps { list-style: none; padding: 0; margin: 8px 0; }
  #runsteps li { margin: 8px 0; }
  #runsteps li.todo { color: var(--muted); }
  #runsteps small { display: block; color: var(--muted); margin: 2px 0 0 20px; }
  .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <p class="back"><a href="/">All models</a> · <a href="/models">Models</a> · <a href="/settings">Settings</a></p>
  <h1>Add model</h1>
  <form id="lookup">
    <label>Instagram link or handle<input id="who" required autofocus autocomplete="off" placeholder="Paste a profile link: it's looked up as you paste"></label>
  </form>
  <div id="info"></div>
  <div id="go" hidden>
    <label><input type="checkbox" id="limited"> Only the newest<input type="number" id="limit" value="100" min="1" step="1">posts</label>
    <p id="eta"></p>
    <p id="skips" class="muted"></p>
    <p id="msg" role="alert"></p>
    <div class="row"><button id="start">Add her</button></div>
  </div>
  <div id="run" hidden>
    <p id="runhead" aria-live="polite"></p>
    <ol id="runsteps"></ol>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
let P = null, polling = false, seq = 0, timer;  // P: the looked-up profile
const api = (path, opts = {}) => fetch(path, {...opts, headers: {"X-Instatagger": "1", "Content-Type": "application/json"}})
  .then(async r => { const j = await r.json(); if (!r.ok) throw new Error(j.error); return j; });
const fmt = s => s < 90 ? `${Math.round(s)} s` : `${Math.round(s / 60)} min`;
const handleOf = text => text.trim().split("instagram.com/").pop().split("/")[0].split("?")[0].replace(/^@/, "");
// an Instagram error that means the saved sessionid stopped working (or there is none)
const loginHelp = msg => /session|login|401|403|checkpoint|unauthori/i.test(msg) ? ` <a href="/settings">Update your Instagram login in Settings</a>.` : "";
const daysAgo =d => { const n = Math.round((Date.now() - Date.parse(d)) / 864e5); return n < 1 ? "today" : n === 1 ? "yesterday" : `${n} days ago`; };

function eta() {  // measured on a 100-post run: ~50 s to find her and list the first 12 posts, then ~12 s per page of 33;
  // downloads keep up with the listing; the tagger loads in ~35 s meanwhile and tags ~15 photos/s; ~30 s to finish.
  // Photos per post come from her own newest posts when known.
  const posts = $("limited").checked ? Math.min(Math.max(Math.floor(+$("limit").value) || 0, 0), P.posts) : P.posts;
  const perPost = P.recent ? P.photo_posts / P.recent * P.photos_per_post : 3;
  if (P.have && ($("limited").checked ? P.listed >= posts : P.to_end))  // it stops at the posts she has
    return $("eta").textContent = "About 1-2 min: earlier runs already went this far, so it only fetches posts she added since.";
  const photos = Math.round(posts * perPost), list = 50 + Math.ceil(Math.max(posts - 12, 0) / 33) * 12, tag = 35 + photos / 15;
  $("eta").textContent = `About ${fmt(Math.max(list, tag) + 30)} for ${posts.toLocaleString()} posts (~${photos.toLocaleString()} photos): ` +
    `listing takes about ${fmt(list)}, and photos are downloaded and tagged while it lists.`;
}

async function lookup() {
  const handle = handleOf($("who").value);
  if (!handle || handle === P?.handle) return;
  $("go").hidden = true;
  if (!/^\w(?:[\w.]{0,28}\w)?$/.test(handle)) return $("info").textContent = "That doesn't look like an Instagram link or handle.";
  const mine = ++seq;
  $("info").textContent = `Looking up @${handle} on Instagram...`;
  let p;
  try { p = await api("/api/profile?u=" + encodeURIComponent(handle)); }
  catch (err) { if (mine === seq) $("info").innerHTML = esc(err.message) + loginHelp(err.message); return; }
  if (mine !== seq) return;  // a newer look-up has started
  P = p;
  const row = (k, v) => `<tr><td>${k}</td><td>${v}</td></tr>`;
  let rows = row("Name", esc(P.name || "-") + (P.verified ? " (verified)" : "")) + row("Handle", "@" + esc(P.handle)) +
    row("Posts", P.posts.toLocaleString()) + row("Followers", P.followers.toLocaleString());
  if (P.recent) rows += row("Last post", `${P.last_post} (${daysAgo(P.last_post)})`) + row("Posting", `about ${P.per_week} posts a week`) +
    row(`Newest ${P.recent} posts`, `${P.photo_posts} with photos, ${P.photos_per_post} photos each on average`) +
    row("Likes", P.likes === null ? "hidden on her posts" : `about ${P.likes.toLocaleString()} a post (${P.like_rate}% of her followers)`);
  if (P.have) rows += row("Already added", `${P.have.toLocaleString()} photos. Running again adds her new posts.`);
  $("info").innerHTML = `<table>${rows}</table>` + (P.private ? "<p>Private account you don't follow, so it can't be added.</p>" : "");
  $("go").hidden = P.private;
  if (!P.private) eta();
}

// name, what it does, its progress line, the line that says it's done. The first three overlap: each photo is
// downloaded as soon as the listing finds it and tagged as soon as it's in
const STAGES = [
  ["Listing posts", "Going through her posts on Instagram, one page every 6-12 s so your account doesn't get flagged. Videos and reels are skipped.",
    /^(\d+)\/(\d+) posts listed, (\d+) photos found/, /the rest are already in her library|stopped the listing|^Step 2\//],
  ["Downloading photos", "Starts with the first photos found, 8 at a time, in the smallest size that's still sharp enough to tag; each becomes a 360 px preview. Failed downloads get one retry at the end.",
    /^(\d+)\/(\d+) (photos downloaded|failed photos retried)/, /photos downloaded, \d+ failed/],
  ["Tagging photos", "The booru tagger scores each photo on your GPU as soon as it's downloaded.",
    /^(\d+)\/(\d+) photos scored/, /^applying your tags/],
  ["Finishing", "Photos without a girl are skipped and deleted, your tags are applied and the pages rebuilt.",
    /^(applying your tags|skipping photos without a girl|building pages)/, /^\d+ photos ->/],
];
const num = n => (+n).toLocaleString();
const detail = (k, m) => !m ? "" : [
  `${num(m[1])} of ${num(m[2])} posts, ${num(m[3])} photos found`,
  `${num(m[1])} of ${num(m[2])} ${m[3] === "photos downloaded" ? "photos" : "failed photos retried"}`,
  `${num(m[1])} of ${num(m[2])} downloaded photos`,
  m[1],  // what it's doing now
][k];

function showRun(s) {  // s.log: [seconds since start, line] from the run's output
  const log = s.log.map(([t, l]) => [t, l.trim()]);
  $("runsteps").innerHTML = STAGES.map(([name, desc, count, ends], k) => {
    const hits = log.filter(([, l]) => count.test(l)), last = hits.at(-1), m = last?.[1].match(count);
    const end = (k === 0 && m && m[1] === m[2] ? last : null) || log.find(([, l]) => ends.test(l));  // or: listed them all
    if (!hits.length && !end) return `<li class="todo">○ ${name}</li>`;
    const t0 = ((k === 0 && log.find(([, l]) => /^Step 1\//.test(l))) || hits[0] || end)[0];  // listing starts with the run
    const text = detail(k, m) ? ": " + detail(k, m) : "";
    if (end) return `<li>✓ ${name}${text} (${fmt(end[0] - t0)})</li>`;
    if (!s.running) return `<li>✗ ${name}${text}</li>`;
    // pace since the first page: finding her on Instagram first takes ~50 s and would make the rest look slow
    const first = hits[0]?.[1].match(count), done = m && first ? m[1] - first[1] : 0;
    const left = k === 0 && done > 0 ? (m[2] - m[1]) * (s.elapsed - hits[0][0]) / done : 0;
    return `<li>● ${name}${text}${left >= 1 ? `, about ${fmt(left)} left` : ""}` +
      (k < 3 && m ? `<progress max="${m[2]}" value="${m[1]}"></progress>` : "") + `<small>${desc}</small></li>`;
  }).join("");
  const end = s.log.map(([, l]) => l.match(/^(\d+) photos ->.*\| (\d+) without a girl/)).filter(Boolean).at(-1);
  const why = [...s.log].reverse().map(([, l]) => l).find(l => /Only|No photos|stopped|rror|Not an Instagram/.test(l)) || s.log.at(-1)?.[1] || "unknown error";
  $("runhead").innerHTML = esc(s.running ? `Adding @${s.handle}: ${fmt(s.elapsed)} so far.` +
      (log.some(([, l]) => /posts listed/.test(l)) ? "" : " Starting up and finding her on Instagram.")
    : s.code === 0 && end ? `Done in ${fmt(s.elapsed)}: @${s.handle} now has ${(+end[1]).toLocaleString()} photos (${end[2]} skipped). She's on the All models page now.`
    : `Adding @${s.handle} stopped: ${why.trim()}`) + (!s.running && !(s.code === 0 && end) ? loginHelp(why) : "");
}

async function poll() {
  if (polling) return;
  polling = true;
  for (;;) {
    const s = await api("/api/status").catch(() => null);
    if (!s || !s.handle) break;
    $("run").hidden = false;
    showRun(s);
    if (!s.running) break;
    await new Promise(r => setTimeout(r, 2000));
  }
  polling = false;
}

$("who").oninput = () => { clearTimeout(timer); timer = setTimeout(lookup, 700); };  // looks up once you stop typing or paste
$("lookup").onsubmit = e => { e.preventDefault(); clearTimeout(timer); lookup(); };
$("limited").onchange = $("limit").oninput = () => P && eta();
$("start").onclick = async () => {
  const n = Math.floor(+$("limit").value);
  $("msg").textContent = "";
  if ($("limited").checked && !(n >= 1)) return $("msg").textContent = "Enter how many posts: 1 or more.";
  try {
    await api("/api/add", {method: "POST", body: JSON.stringify({u: P.handle, limit: $("limited").checked ? n : null})});
    $("go").hidden = true;
    poll();
  } catch (err) { $("msg").textContent = err.message; }
};
api("/api/settings").then(s => {
  const what = [s.rules.nobody.on && "photos with nobody in them", s.rules.no_girl.on && "photos without a girl",
    s.rules.cartoon.on && "cartoons and memes", s.skip.length && `photos tagged ${s.skip.map(r => r.split(":")[0].trim()).join(", ")}`].filter(Boolean);
  $("skips").innerHTML = (what.length ? `Skipped and deleted: ${esc(what.join(", "))}. ` : "Nothing is skipped: every photo is kept. ") +
    `<a href="/settings">Change in Settings</a>`;
}).catch(() => {});
$("who").value = new URLSearchParams(location.search).get("u") || "";  // "Add new posts" on the Models page
if ($("who").value) lookup();
poll();  // show a run that is already going
</script>
</body>
</html>
