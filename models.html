<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Models · instatagger</title>
<style>
  :root { color-scheme: dark; --bg: #0d0d0f; --panel: #161619; --raise: #1f1f23; --line: #26262b; --text: #f4f4f5; --muted: #a1a1aa; --accent: #c13584; --no: #e5484d; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  a { color: var(--text); }
  button { font: inherit; color: var(--text); cursor: pointer; }
  button:disabled { opacity: .35; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .brand { font-weight: 600; font-size: 16px; text-decoration: none; }
  header span { color: var(--muted); flex: 1; }
  .btn { height: 40px; display: inline-flex; align-items: center; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); text-decoration: none; }
  .btn.main { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
  .btn.del { color: #ff9592; margin-left: auto; }
  main { max-width: 1280px; margin: 0 auto; padding: 20px 16px 40px; display: flex; flex-direction: column; gap: 24px; }
  h1 { margin: 0; font-size: 24px; } h2 { margin: 0 0 12px; font-size: 16px; }
  .sum, .muted { color: var(--muted); }
  #msg { color: #ff9592; margin: 0; }
  #cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
  .card { display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
  .thumbs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
  .thumbs a { position: relative; display: block; aspect-ratio: 4 / 5; border-radius: 6px; overflow: hidden; background: var(--raise); }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumbs span { position: absolute; inset: auto 0 0; padding: 10px 4px 2px; font-size: 11px; background: linear-gradient(transparent, #000c); }
  .name { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .name a { font-weight: 600; font-size: 16px; }
  .mix { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--line); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 13px; }
  dt { color: var(--muted); } dd { margin: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips span { padding: 3px 9px; border-radius: 999px; background: var(--raise); font-size: 12px; }
  .chips b { color: var(--muted); font-weight: 500; }
  .card h3 { margin: 0 0 6px; font-size: 12px; font-weight: 500; color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  section.box { padding: 18px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
  table { border-collapse: collapse; }
  td { padding: 4px 16px 4px 0; vertical-align: top; } td:first-child { color: var(--muted); white-space: nowrap; }
</style>
</head>
<body>
<header>
  <a class="brand" href="/">instatagger</a>
  <span>Models</span>
  <a class="btn" href="/">All models</a>
  <a class="btn main" href="/add" target="_blank">+ Add model</a>
</header>
<main>
  <div>
    <h1>Your models</h1>
    <p class="sum" id="sum">Loading...</p>
    <p id="msg" role="alert"></p>
  </div>
  <div id="cards"></div>
  <section class="box" aria-labelledby="sethead">
    <h2 id="sethead">Settings</h2>
    <table id="settings"></table>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
const api = (path, opts = {}) => fetch(path, {...opts, headers: {"X-Instatagger": "1", "Content-Type": "application/json"}})
  .then(async r => { const j = await r.json(); if (!r.ok) throw new Error(j.error); return j; });
const num = n => n === null || n === undefined ? "-" : Math.round(n).toLocaleString();
const size = b => b >= 2 ** 30 ? `${(b / 2 ** 30).toFixed(1)} GB` : `${Math.round(b / 2 ** 20).toLocaleString()} MB`;
const post = it => `https://www.instagram.com/p/${it.c}/?img_index=${it.n}`;
const COLORS = {safe: "#4ade80", suggestive: "#fbbf72", questionable: "#f87171", explicit: "#c13584"};
let M = null;

function card(m, running) {
  const pct = n => `${Math.round(n / Math.max(m.photos, 1) * 100)}%`;
  const rows = [
    ["Photos", `${num(m.photos)} from ${num(m.posts)} posts (${(m.photos / Math.max(m.posts, 1)).toFixed(1)} per post)`],
    ["Skipped", `${num(m.skipped)} without a girl`],
    ["Posted", m.oldest ? `${m.oldest} to ${m.newest}, about ${m.per_week} photo posts a week` : "-"],
    ["Likes", m.likes ? `median ${num(m.likes)}, average ${num(m.likes_avg)}, most ${num(m.likes_max)}` : "hidden on all her photos"],
    ["Hidden likes", m.hidden ? `${num(m.hidden)} photos (${pct(m.hidden)})` : "none"],
    ["Suggestiveness", m.spice === null ? "not scored" : `${m.spice}% on average`],
    ["On disk", `${size(m.disk)} in ${num(m.files)} files (previews ${size(m.thumbs)})`],
    ["Updated", m.updated.replace("T", " ")],
  ];
  const mix = m.rating ? Object.entries(m.rating) : [];
  return `<article class="card">
    <div class="thumbs">${m.best.map(it => `<a href="${post(it)}" target="_blank" rel="noopener" title="Open on Instagram">
      <img src="/${encodeURIComponent(m.handle)}/thumbs/${encodeURIComponent(it.f)}" alt="" loading="lazy">${it.l > 3 ? `<span>♥ ${num(it.l)}</span>` : ""}</a>`).join("")}</div>
    <div class="name"><a href="/${encodeURIComponent(m.handle)}/index.html">@${esc(m.handle)}</a>
      <a class="muted" href="https://www.instagram.com/${encodeURIComponent(m.handle)}/" target="_blank" rel="noopener">Instagram</a></div>
    ${mix.length ? `<div class="mix" role="img" aria-label="Rating mix: ${mix.map(([r, n]) => `${r} ${pct(n)}`).join(", ")}">
      ${mix.map(([r, n]) => `<span style="width:${pct(n)};background:${COLORS[r]}"></span>`).join("")}</div>
      <div class="legend">${mix.map(([r, n]) => `<span><i style="background:${COLORS[r]}"></i>${r} ${num(n)}</span>`).join("")}</div>` : ""}
    <dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    <div><h3>Top tags</h3><div class="chips">${m.top.map(([t, n]) => `<span>${esc(t)} <b>${pct(n)}</b></span>`).join("") || "none"}</div></div>
    ${m.lift.length ? `<div><h3>Most liked tags, against her median</h3><div class="chips">${m.lift.map(([t, x]) => `<span>${esc(t)} <b>×${x}</b></span>`).join("")}</div></div>` : ""}
    <div class="row">
      <a class="btn" href="/${encodeURIComponent(m.handle)}/index.html">Open</a>
      <a class="btn" href="/add?u=${encodeURIComponent(m.handle)}" target="_blank">Add new posts</a>
      <button class="btn del" data-h="${esc(m.handle)}" ${running ? `disabled title="Wait for @${esc(running)} to finish adding"` : ""}>Delete</button>
    </div>
  </article>`;
}

async function load() {
  try { M = await api("/api/models"); }
  catch (err) { $("sum").textContent = ""; $("msg").textContent = `Couldn't load the models: ${err.message}`; return; }
  const ms = M.models, add = k => ms.reduce((a, m) => a + m[k], 0);
  $("sum").textContent = `${ms.length} models · ${num(add("photos"))} photos from ${num(add("posts"))} posts · ` +
    `${num(add("skipped"))} skipped · ${size(add("disk"))} on disk, ${size(M.settings.free)} free` +
    (M.running ? ` · adding @${M.running} now` : "");
  $("cards").innerHTML = ms.map(m => card(m, M.running)).join("") || `<p class="muted">No models yet. <a href="/add">Add one</a>.</p>`;
  const s = M.settings, tags = s.groups.reduce((a, [, n]) => a + n, 0);
  const row = (k, v) => `<tr><td>${k}</td><td>${v}</td></tr>`;
  $("settings").innerHTML =
    row("Instagram login", s.session ? `session.txt from ${s.session}. If adding fails with a login error, paste a fresh sessionid there.` : "No session.txt: paste your sessionid into it to add models.") +
    row("Tagger", `${esc(s.tagger)}, runs on your GPU`) +
    row("Default cutoff", `${Math.round(s.cutoff * 100)}%: a booru tag counts when the tagger is at least this sure`) +
    row("Tag list", `${tags} tags in ${s.groups.length} groups (${s.groups.map(([g, n]) => `${esc(g)} ${n}`).join(", ")}). Edit tags.txt, then run <code>python instatagger.py &lt;handle&gt; --retag</code> per model to apply.`) +
    row("Library folder", esc(s.folder)) +
    row("Free space", size(s.free));
}

$("cards").onclick = async e => {
  const b = e.target.closest("button.del");
  if (!b) return;
  const m = M.models.find(m => m.handle === b.dataset.h);
  if (!confirm(`Delete @${m.handle} from the library?\n\nHer ${m.photos.toLocaleString()} photos, previews and scores (${size(m.disk)}) are removed from this computer. ` +
    "Nothing changes on Instagram. Adding her again downloads everything again.")) return;
  b.disabled = true;
  $("msg").textContent = "";
  try { await api("/api/delete", {method: "POST", body: JSON.stringify({u: m.handle})}); }
  catch (err) { $("msg").textContent = `Couldn't delete @${m.handle}: ${err.message}`; }
  load();
};
load();
</script>
</body>
</html>
